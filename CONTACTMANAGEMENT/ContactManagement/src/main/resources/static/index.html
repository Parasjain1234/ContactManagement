<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Manager</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#38bdf8,#6366f1);
  font-family:"Segoe UI",Arial;
}

.container{
  width:440px;
  background:#fff;
  padding:22px;
  border-radius:18px;
  box-shadow:0 25px 50px rgba(0,0,0,.3);
}

h2{text-align:center;margin-bottom:14px;}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #d1d5db;
  font-size:15px;
}

.buttons{display:flex;gap:12px;margin-top:10px;}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  color:#fff;
}

#addBtn{background:#4f46e5;}
#updateBtn{background:#059669;}
#searchBtn{background:#0ea5e9;width:100%;margin-top:6px;}

ul{list-style:none;padding:0;max-height:260px;overflow-y:auto;}

li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin-bottom:10px;
  background:#f1f5f9;
  border-radius:14px;
  cursor:pointer;
}

li.selected{border:2px solid #22c55e;}

.delete-btn{
  background:#ef4444;
  border:none;
  color:#fff;
  border-radius:10px;
  width:38px;
  height:32px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <h2>📞 Contact Manager</h2>

  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone">

  <div class="buttons">
    <button id="addBtn">Add</button>
    <button id="updateBtn">Update</button>
  </div>

  <div class="search-box">
    <input id="search" placeholder="Search by name or phone">
    <button id="searchBtn">Search</button>
  </div>

  <ul id="list"></ul>
</div>

<script>
const api = "http://localhost:8080/contacts";
let selectedId = null;

// DOM references (🔥 MAIN FIX)
const nameInput = document.getElementById("name");
const phoneInput = document.getElementById("phone");
const listEl = document.getElementById("list");
const searchInput = document.getElementById("search");

document.getElementById("addBtn").onclick = addContact;
document.getElementById("updateBtn").onclick = updateContact;
document.getElementById("searchBtn").onclick = searchContact;

/* ADD */
function addContact(){
  fetch(api,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      name: nameInput.value.trim(),
      phone: phoneInput.value.trim()
    })
  }).then(()=>{ clearForm(); load(); });
}

/* UPDATE */
function updateContact(){
  if(selectedId === null){
    alert("Select a contact from list first");
    return;
  }

  fetch(api+"/"+selectedId,{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      name: nameInput.value.trim(),
      phone: phoneInput.value.trim()
    })
  }).then(()=>{ clearForm(); load(); });
}

/* LOAD */
function load(){
  fetch(api).then(r=>r.json()).then(show);
}

/* SHOW */
function show(data){
  listEl.innerHTML="";
  data.forEach(c=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>${c.name} - ${c.phone}</span>
                  <button class="delete-btn">X</button>`;

    li.onclick=()=>{
      document.querySelectorAll("li").forEach(x=>x.classList.remove("selected"));
      li.classList.add("selected");

      selectedId=c.id;
      nameInput.value=c.name;
      phoneInput.value=c.phone;
    };

    li.querySelector("button").onclick=(e)=>{
      e.stopPropagation();
      del(c.id);
    };

    listEl.appendChild(li);
  });
}

/* DELETE */
function del(id){
  fetch(api+"/"+id,{method:"DELETE"}).then(load);
}

/* SEARCH */
function searchContact(){
  const q=searchInput.value.trim();
  if(q===""){ load(); return; }
  fetch(api+"/search?q="+q).then(r=>r.json()).then(show);
}

/* CLEAR */
function clearForm(){
  selectedId=null;
  nameInput.value="";
  phoneInput.value="";
  document.querySelectorAll("li").forEach(x=>x.classList.remove("selected"));
}

load();
</script>

</body>
</html>
